services:
  openstoryline:
    environment:
      OPENSTORYLINE_LLM_MODEL: qwen3.7-plus
      OPENSTORYLINE_LLM_BASE_URL: "${DASHSCOPE_BASE_URL:?Set DASHSCOPE_BASE_URL in .env}"
      OPENSTORYLINE_LLM_API_KEY: "${DASHSCOPE_API_KEY:?Set DASHSCOPE_API_KEY in .env}"
      OPENSTORYLINE_VLM_MODEL: qwen3.7-plus
      OPENSTORYLINE_VLM_BASE_URL: "${DASHSCOPE_BASE_URL:?Set DASHSCOPE_BASE_URL in .env}"
      OPENSTORYLINE_VLM_API_KEY: "${DASHSCOPE_API_KEY:?Set DASHSCOPE_API_KEY in .env}"
    volumes:
      - ./runtime/openstoryline/qwen/outputs:/app/outputs
