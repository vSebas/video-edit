<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Video Editing Workbench</title>
    <meta http-equiv="Cache-Control" content="no-cache" />
    <link rel="stylesheet" href="/styles.css?v=16" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">V</span>
          <div>
            <strong>Vlog Studio</strong>
            <span>your footage, AI-edited</span>
          </div>
        </div>

        <button class="primary full" id="new-project-button">+ New vlog from clips</button>

        <div class="side-heading">My vlogs</div>
        <nav id="project-list" class="project-list" aria-label="Projects"></nav>

        <div class="side-heading status-heading">System</div>
        <div id="capability-list" class="capability-list"></div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <span class="eyebrow" id="project-status">Loading project</span>
            <h1 id="project-title">Video Editing Workbench</h1>
          </div>
          <div class="top-actions" id="top-actions"></div>
        </header>

        <div id="notice" class="notice hidden" role="status"></div>
        <section id="project-view" class="project-view loading">
          <div class="empty-state">Loading the project workspace…</div>
        </section>
      </main>
    </div>

    <dialog id="new-project-dialog">
      <form id="new-project-form">
        <div class="dialog-heading">
          <div>
            <span class="eyebrow">New vlog</span>
            <h2>Where are your clips?</h2>
          </div>
          <button type="button" class="icon-button" id="close-dialog" aria-label="Close">×</button>
        </div>
        <label>
          Give this day a name
          <input name="name" required placeholder="Tuesday — lake trip" />
        </label>
        <label>
          Upload clips from this device
          <input type="file" name="files" id="upload-files" multiple accept="video/*,image/*,audio/*" />
        </label>
        <p class="form-note">…or pick a folder already on the computer:</p>
        <label>
          Folder with your clips
          <input name="source_directory" placeholder="Pick below or type a path" />
        </label>
        <div id="folder-browser" class="folder-browser" aria-label="Browse workspace folders"></div>
        <label>
          What's the story? (optional)
          <textarea name="prompt" rows="3" placeholder="A short fun vlog of my day, ending with the sunset…"></textarea>
        </label>
        <p class="form-note">
          Your files stay where they are — nothing is copied or modified.
        </p>
        <div class="dialog-actions">
          <button type="button" class="secondary" id="cancel-dialog">Cancel</button>
          <button type="submit" class="primary">Add my clips</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/app.js?v=26"></script>
  </body>
</html>
