name: video-editing

services:
  app:
    image: video-editing-app:local
    build:
      context: ./app
      dockerfile: Dockerfile
    init: true
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    gpus: all
    # Host networking so the app can reach OpenTake's loopback-only MCP
    # listener (127.0.0.1:19789). Bind address moves into uvicorn itself.
    network_mode: host
    # The workspace is mounted at its host path so that exported timelines
    # reference media locations that DaVinci Resolve can open directly.
    working_dir: ${PWD}/app
    environment:
      HOME: /tmp
      PYTHONUNBUFFERED: "1"
      VIDEO_EDITING_ROOT: ${PWD}
      VIDEO_EDITING_RUNTIME: ${PWD}/runtime/projects
      HF_HOME: ${PWD}/runtime/model-cache
      RCLONE_CONFIG: /tmp/rclone/rclone.conf
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY:-}"
      DASHSCOPE_BASE_URL: "${DASHSCOPE_BASE_URL:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENTAKE_MCP_TOKEN: "${OPENTAKE_MCP_TOKEN:-}"
      OPENTAKE_PROJECTS_DIR: /opentake-projects
      # Set this before exposing the port beyond localhost: without it the
      # API is open to anyone who can reach it (footage, deletion, paid calls).
      VIDEO_EDITING_TOKEN: "${VIDEO_EDITING_TOKEN:-}"
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./:${PWD}
      # Read-only: the host's Drive credentials can no longer be modified
      # from inside the container. The startup script copies the config to
      # a container-local path so rclone's OAuth refresh still works (the
      # refreshed copy is ephemeral; the durable refresh token stays on
      # the host untouched).
      - ${HOME}/.config/rclone:/rclone-ro:ro
      # Read-only view of OpenTake project bundles so the sync staleness
      # guard can compare the live MCP timeline against the saved file.
      - ${OPENTAKE_PROJECTS_DIR:-${HOME}/Documents/OpenTake}:/opentake-projects:ro
    # Set VIDEO_EDITING_BIND=0.0.0.0 to reach the app from your phone on
    # the same WiFi (http://<laptop-ip>:8787). Default is laptop-only.
    # A non-loopback bind REQUIRES VIDEO_EDITING_TOKEN — the app refuses to
    # start open to the network without auth (footage, deletion, paid calls).
    command:
      - sh
      - -c
      - >
        BIND="${VIDEO_EDITING_BIND:-127.0.0.1}";
        TOKEN_TRIMMED="$$(printf %s "${VIDEO_EDITING_TOKEN:-}" | tr -d "[:space:]")";
        if [ "$$BIND" != "127.0.0.1" ] && [ -z "$$TOKEN_TRIMMED" ];
        then echo "REFUSING to bind $$BIND without VIDEO_EDITING_TOKEN" >&2; exit 1; fi;
        mkdir -p /tmp/rclone &&
        { cp /rclone-ro/rclone.conf /tmp/rclone/rclone.conf 2>/dev/null || true; } &&
        exec uvicorn video_app.main:app --host "$$BIND" --port "${VIDEO_EDITING_APP_PORT:-8787}"

