name: video-editing

services:
  app:
    image: video-editing-app:local
    build:
      context: ./app
      dockerfile: Dockerfile
    init: true
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace/video-editing/app
    environment:
      HOME: /tmp
      PYTHONUNBUFFERED: "1"
      VIDEO_EDITING_ROOT: /workspace/video-editing
      VIDEO_EDITING_RUNTIME: /workspace/video-editing/runtime/projects
      VIDEO_EDITING_POC_ROOT: /workspace/video-editing/poc-morning-routine
      VIDEO_EDITING_SEMANTIC_SOURCE_ROOT: /workspace/video-editing/runtime/openstoryline
    volumes:
      - ./:/workspace/video-editing
    ports:
      - "127.0.0.1:${VIDEO_EDITING_APP_PORT:-8787}:8787"
    command: ["uvicorn", "video_app.main:app", "--host", "0.0.0.0", "--port", "8787"]

  poc:
    image: video-editing-poc:local
    build:
      context: ./poc-morning-routine
      dockerfile: Dockerfile
    init: true
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace/video-editing/poc-morning-routine
    environment:
      HOME: /tmp
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./:/workspace/video-editing
    command: ["scripts/validate_artifacts.py"]

  openstoryline:
    image: "${OPENSTORYLINE_IMAGE:-firered-openstoryline:local}"
    profiles: ["openstoryline"]
    init: true
    network_mode: host
    environment:
      HOST: 127.0.0.1
      PORT: "7860"
    volumes:
      - ./repos/FireRed-OpenStoryline/config.toml:/app/config.toml:ro
      - ./runtime/openstoryline/outputs:/app/outputs
    restart: unless-stopped
