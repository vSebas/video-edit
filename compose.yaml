name: video-editing

services:
  app:
    image: video-editing-app:local
    build:
      context: ./app
      dockerfile: Dockerfile
    init: true
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    gpus: all
    # The workspace is mounted at its host path so that exported timelines
    # reference media locations that DaVinci Resolve can open directly.
    working_dir: ${PWD}/app
    environment:
      HOME: /tmp
      PYTHONUNBUFFERED: "1"
      VIDEO_EDITING_ROOT: ${PWD}
      VIDEO_EDITING_RUNTIME: ${PWD}/runtime/projects
      HF_HOME: ${PWD}/runtime/model-cache
      RCLONE_CONFIG: /rclone/rclone.conf
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY:-}"
      DASHSCOPE_BASE_URL: "${DASHSCOPE_BASE_URL:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      # Set this before exposing the port beyond localhost: without it the
      # API is open to anyone who can reach it (footage, deletion, paid calls).
      VIDEO_EDITING_TOKEN: "${VIDEO_EDITING_TOKEN:-}"
    volumes:
      - ./:${PWD}
      # Read-write so rclone can refresh its OAuth token.
      - ${HOME}/.config/rclone:/rclone
    ports:
      # Set VIDEO_EDITING_BIND=0.0.0.0 to reach the app from your phone on
      # the same WiFi (http://<laptop-ip>:8787). Default is laptop-only.
      # Pair that with VIDEO_EDITING_TOKEN — campus WiFi is not private.
      - "${VIDEO_EDITING_BIND:-127.0.0.1}:${VIDEO_EDITING_APP_PORT:-8787}:8787"
    command: ["uvicorn", "video_app.main:app", "--host", "0.0.0.0", "--port", "8787"]

